[project]
name = "murphy"
version = "0.1.0"
description = "Voice-controlled orchestration layer for developer workflows"
authors = [
    { name = "Martin Sim", email = "martin.simulator@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pyobjc-framework-Cocoa>=11.0",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.5",
]

[project.scripts]
murphy = "murphy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
